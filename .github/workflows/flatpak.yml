#
# Fork-only. Builds the KRDC AVD Flatpak (io.github.manicminer.krdc) UNSIGNED and hands it to the
# central manicminer Flatpak publisher (github.com/manicminer/flatpak), which alone holds the
# signing key. See packaging/flatpak/README.md.
#
# - push of a release tag v*.avd* whose commit is on master: build, GitHub Release with a bundle.
#   (Needs packaging/flatpak/manicminer-flatpak.gpg committed: without it the run fails.)
# - workflow_dispatch on master with source_tag: build an EXISTING tag with master's packaging
#   (packaging/flatpak/patches/<tag>/ for tags that predate Flatpak support). Tags are never made
#   or moved here.
# - pull requests touching the packaging: build and sandbox test only.
# Nothing here calls the publisher: its scheduled sweep finds successful tag and dispatch runs of
# this workflow (by event, ref and the run name below) and publishes them, usually within 15-30 min.
name: Flatpak
run-name: Flatpak ${{ inputs.source_tag || github.ref_name }}

on:
  push:
    tags: ['v*.avd*']
  pull_request:
    paths: ['packaging/flatpak/**', '.github/workflows/flatpak.yml', 'rdp/avd/**', 'CMakeLists.txt', 'rdp/CMakeLists.txt', 'main.cpp']
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing release tag to build (on master), e.g. v26.11.70.r2459.g23ff7258.avd1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      commit: ${{ steps.v.outputs.commit }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          source packaging/flatpak/lib.sh
          case "$EVENT" in
            push) tag="$REF_NAME"; release=true ;;
            workflow_dispatch)
              [[ "$REF" == refs/heads/master ]] || die "run the dispatch on master: its packaging is the trusted one"
              tag="$INPUT_TAG"; release=false ;;
            pull_request) echo "tag=" >>"$GITHUB_OUTPUT"; echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"; echo "release=false" >>"$GITHUB_OUTPUT"; exit 0 ;;
            *) die "unexpected event" ;;
          esac
          validate_tag "$tag" || die "not a release tag of this fork: $tag"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || die "no such tag"
          commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$commit" FETCH_HEAD || die "$tag is not on master"
          { echo "tag=$tag"; echo "commit=$commit"; echo "release=$release"; } >>"$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Packaging (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: packaging-src
          persist-credentials: false
      - name: Source (the tag's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          path: src
          persist-credentials: false
      - name: Flatpak tooling
        run: bash packaging-src/packaging/flatpak/ci-install-deps.sh
      - name: Build (no secrets)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          args=(--source src --out out --commit "$COMMIT" --packaging-commit "$GITHUB_SHA" --run-tests)
          [[ -n "$TAG" ]] && args+=(--tag "$TAG")
          key=packaging-src/packaging/flatpak/manicminer-flatpak.gpg
          [[ -s "$key" ]] && args+=(--bundle-gpg-key "$key")
          packaging-src/packaging/flatpak/build.sh "${args[@]}"
      - name: Sign-in return path in the sandbox (offline)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          export FLATPAK_USER_DIR="$RUNNER_TEMP/flatpak-test"
          mkdir -p "$FLATPAK_USER_DIR"
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
          args=(--repo out/repo --source src)
          [[ -n "$TAG" ]] && args+=(--tag "$TAG")
          packaging-src/packaging/flatpak/test-sandbox-callback.sh "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-io.github.manicminer.krdc-x86_64
          path: |
            out/SOURCE.json
            out/repo.tar
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-x86_64
          path: out/*.flatpak
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: [validate, build]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-x86_64
          path: bundle
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(bundle/*.flatpak)
          ((${#files[@]})) || { echo "::error::no bundle: commit packaging/flatpak/manicminer-flatpak.gpg (public key) first"; exit 1; }
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" \
            --notes "Unofficial KRDC fork build. Install from the manicminer Flatpak repository (https://manicminer.github.io/flatpak/) or this bundle; updates come from that repository."
          gh release upload "$TAG" -R "$REPO" --clobber "${files[@]}"
